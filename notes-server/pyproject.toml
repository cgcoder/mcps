[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-server"
version = "0.1.0"
description = "Personal notes MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
notes-server = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
